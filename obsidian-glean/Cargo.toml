[workspace]
resolver = "2"
members = ["crates/markdown-glean", "crates/obsidian-glean"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
regex = "1"
markdown-glean = { path = "crates/markdown-glean" }

[profile.release]
opt-level = 3
